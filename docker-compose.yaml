services:
  paseo:
    build: .
    container_name: paseo
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "6767:6767"
    expose:
      - "6767"
    environment:
      PASEO_PASSWORD: ${PASEO_PASSWORD:-password}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES:-localhost}
    volumes:
      - paseo-home:/home/paseo
      - ./config.json:/home/paseo/.paseo/config.json
      - workspace:/workspace

volumes:
  paseo-home:
  workspace:
