services:
  paseo:
    build: .
    container_name: paseo
    restart: unless-stopped
    expose:
      - "6767"
    environment:
      PASEO_PASSWORD: ${PASEO_PASSWORD}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES}
    volumes:
      - paseo-home:/home/paseo
      - workspace:/workspace

volumes:
  paseo-home:
  workspace: